<html>
    <head>
        <title>Minha lista de tarefas</title>
        <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
    </head>
    <body>
      Aqui fica a lista de tarefas
      {% if lista %}
         <ol>
        {% for item in lista %}
        <li>{{item}}</li>
        <a href="/delete/{{loop.index0}}"><button>🗑️</button></a>
        {% endfor %}
        </ol>
      {% else %}
         <p>Não há intems! Parabéns! Você fez tudo das tarefas</p>
      {% endif %}

      <form action="/add" method="post">
           <input type="text" name="nova">
           <button type="submit">Adicionar</button>
      </form>
    </body>
</html>
